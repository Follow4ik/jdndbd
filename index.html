<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiti ✦ твоя Кити</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-bg: #ffd6e8;
    --pink-light: #fff0f7;
    --pink-mid: #ffb7d5;
    --pink: #ff8fc0;
    --pink-deep: #f06292;
    --pink-dark: #d6336c;
    --choco: #4a2b33;
    --white: #ffffff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'Nunito', sans-serif;
    background: var(--pink-bg);
    color: var(--choco);
    overflow: hidden;
  }
  /* ---- фон со спарклами ---- */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 15% 20%, #ffe3f0 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, #ffc9e3 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, #ffc2de 0%, transparent 45%),
      radial-gradient(circle at 10% 90%, #ffe9f4 0%, transparent 40%),
      var(--pink-bg);
  }
  .sparkle {
    position: fixed; z-index: 1; pointer-events: none;
    color: #fff; text-shadow: 0 0 6px #fff, 0 0 12px var(--pink);
    animation: twinkle 3s ease-in-out infinite;
    user-select: none;
  }
  .sparkle.pink { color: var(--pink-deep); text-shadow: 0 0 8px var(--pink); }
  @keyframes twinkle {
    0%,100% { opacity:.15; transform: scale(.7) rotate(0deg); }
    50% { opacity:1; transform: scale(1.15) rotate(20deg); }
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes pop {
    0% { transform: scale(.85); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    25% { transform: scale(1.08); }
    40% { transform: scale(1); }
    60% { transform: scale(1.08); }
  }

  /* ---- экран пароля ---- */
  #gate {
    position: fixed; inset:0; z-index: 50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 22px; padding: 24px; text-align:center;
    background:
      radial-gradient(circle at 20% 15%, #ffe3f0 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffc2de 0%, transparent 45%),
      var(--pink-bg);
    animation: pop .4s ease;
  }
  #gate .kitty {
    width: min(240px, 55vw);
    image-rendering: pixelated;
    border-radius: 24px;
    border: 5px solid var(--white);
    box-shadow: 0 12px 40px rgba(214,51,108,.35), 0 0 0 5px var(--pink-mid);
    animation: floaty 4s ease-in-out infinite;
  }
  #gate h1 {
    font-weight: 900; font-size: clamp(22px, 5vw, 34px);
    color: var(--pink-dark);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 var(--pink-mid);
    letter-spacing: 1px;
  }
  #gate p { font-weight:700; color:#a34d6d; font-size: 15px; }
  .gate-box {
    display:flex; flex-direction:column; gap:12px; width:min(360px, 88vw);
  }
  input, select, button { font-family:'Nunito', sans-serif; }
  .gate-box input {
    padding: 14px 18px; border-radius: 999px;
    border: 4px solid var(--pink-mid);
    background: var(--white);
    font-size: 15px; font-weight: 700; color: var(--choco);
    outline: none; text-align:center;
    transition: .2s;
    box-shadow: 0 4px 0 var(--pink-mid);
  }
  .gate-box input:focus { border-color: var(--pink-deep); box-shadow: 0 4px 0 var(--pink-deep); }
  .btn {
    padding: 14px 22px; border:none; border-radius:999px; cursor:pointer;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff; font-weight:900; font-size:16px; letter-spacing:.5px;
    box-shadow: 0 5px 0 var(--pink-dark), 0 10px 24px rgba(214,51,108,.35);
    transition: .15s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-dark); }
  .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
  #gateError { color:#e0245e; font-weight:800; min-height:20px; font-size:14px; }

  /* ---- чат ---- */
  #app {
    position: relative; z-index: 5;
    height:100%; max-width: 860px; margin: 0 auto;
    display:none; flex-direction:column;
    padding: 14px 14px 10px;
  }
  header {
    display:flex; align-items:center; gap:14px;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(8px);
    border: 4px solid var(--white);
    border-radius: 26px;
    padding: 10px 16px;
    box-shadow: 0 8px 30px rgba(214,51,108,.22);
  }
  header img {
    width:56px; height:56px; object-fit:cover;
    border-radius:16px; border:3px solid var(--pink-mid);
    image-rendering: pixelated;
    animation: heartbeat 2.4s ease-in-out infinite;
  }
  header .name { font-weight:900; font-size:20px; color:var(--pink-dark); line-height:1.1; }
  header .status { font-size:13px; font-weight:800; color:#7fae6f; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#58c94c; box-shadow:0 0 8px #58c94c; display:inline-block; }
  #clearBtn {
    margin-left:auto; border:none; cursor:pointer;
    background: var(--pink-light); color: var(--pink-dark);
    font-weight:800; font-size:13px; padding:8px 14px; border-radius:999px;
    border:3px solid var(--pink-mid); transition:.15s;
  }
  #clearBtn:hover { background:#fff; }

  #chat {
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
    padding: 20px 6px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width:10px; }
  #chat::-webkit-scrollbar-track { background:transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--pink-mid); border-radius:99px; border:2px solid var(--pink-bg); }

  .msg { display:flex; gap:10px; max-width: 85%; animation: pop .25s ease; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .avatar {
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    border:3px solid var(--white); object-fit:cover;
    image-rendering: pixelated;
    box-shadow: 0 3px 10px rgba(214,51,108,.25);
  }
  .bubble {
    padding: 12px 16px; border-radius: 20px;
    font-size: 15.5px; font-weight: 700; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 4px 14px rgba(214,51,108,.15);
  }
  .msg.kiti .bubble {
    background: var(--white);
    border: 3px solid var(--pink-mid);
    border-bottom-left-radius: 6px;
    color: var(--choco);
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff; border:3px solid var(--pink-deep);
    border-bottom-right-radius: 6px;
  }
  .time { display:block; font-size:11px; opacity:.55; margin-top:5px; font-weight:800; }

  .typing { display:inline-flex; gap:5px; padding:6px 2px; }
  .typing i {
    width:8px; height:8px; border-radius:50%; background: var(--pink-deep);
    animation: bounce .9s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay:.15s; }
  .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  form {
    display:flex; gap:10px; align-items:center;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(8px);
    border: 4px solid var(--white);
    border-radius: 999px;
    padding: 8px 8px 8px 20px;
    box-shadow: 0 10px 30px rgba(214,51,108,.25);
  }
  #input {
    flex:1; border:none; outline:none; background:transparent;
    font-size:16px; font-weight:700; color:var(--choco);
    padding: 10px 0;
  }
  #input::placeholder { color:#c98aa8; }
  #sendBtn {
    width:48px; height:48px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(180deg, var(--pink), var(--pink-deep));
    color:#fff; font-size:20px;
    box-shadow: 0 4px 0 var(--pink-dark);
    transition:.15s; flex-shrink:0;
  }
  #sendBtn:hover { filter:brightness(1.07); }
  #sendBtn:active { transform: translateY(3px); box-shadow:0 1px 0 var(--pink-dark); }
  .error-banner {
    background:#ffe1e9; border:3px solid #ff9bb4; color:#b3123f;
    border-radius:16px; padding:10px 14px; font-weight:800; font-size:13px;
    display:none; margin-bottom:8px;
  }
  @media (max-width: 560px) {
    .msg { max-width: 94%; }
    header .name { font-size:17px; }
  }
</style>
</head>

let history = [];

function now() {
  return new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
}
function saveHistory() {
  try { localStorage.setItem("kiti_chat", JSON.stringify(history)); } catch(e) {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem("kiti_chat");
    if (!raw) return false;
    history = JSON.parse(raw);
    history.forEach(m => addMsg(m.role, m.content, false));
    return history.length > 0;
  } catch(e) { return false; }
}

function addMsg(role, text, animate = true) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "kiti");
  const av = document.createElement("img");
  av.className = "avatar";
  av.src = role === "user"
    ? "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='12' fill='#f06292'/><circle cx='20' cy='15' r='7' fill='white'/><path d='M8 38c0-8 5-13 12-13s12 5 12 13z' fill='white'/></svg>`)
    : kittyAvatar;
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.appendChild(document.createTextNode(text));
  const t = document.createElement("span");
  t.className = "time";
  t.textContent = now();
  bub.appendChild(t);
  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  scrollDown();
  return bub;
}

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function showTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg kiti";
  wrap.id = "typingRow";
  const av = document.createElement("img");
  av.className = "avatar"; av.src = kittyAvatar;
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  wrap.appendChild(av); wrap.appendChild(bub);
  chat.appendChild(wrap);
  scrollDown();
}
function hideTyping() {
  const t = document.getElementById("typingRow");
  if (t) t.remove();
}

function greet() {
  const hello = "привееет, солнышко! 🎀 я Кити, такая рада тебя видеть! ✨ расскажи, как прошёл твой день? или спроси меня о чём угодно, я с радостью помогу 💕";
  history.push({role:"assistant", content:hello});
  saveHistory();
  addMsg("assistant", hello);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  errBanner.style.display = "none";
  addMsg("user", text);
  history.push({role:"user", content:text});
  saveHistory();
  showTyping();

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        temperature: 0.8,
        messages: [{role:"system", content:SYSTEM_PROMPT}].concat(history.slice(-20)),
        stream: true
      })
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error("API вернул " + resp.status + ": " + errText.slice(0, 200));
    }

    hideTyping();
    const bub = addMsg("assistant", "");
    const textNode = bub.childNodes[0]; // текстовая нода до span.time
    textNode.textContent = "";

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let full = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (delta) {
            full += delta;
            textNode.textContent = full;
            scrollDown();
          }
        } catch(e) {}
      }
    }
    if (!full) full = "хм, я на секундочку растерялась... давай ещё раз? 🥺";
    history.push({role:"assistant", content:full});
    saveHistory();
  } catch (e) {
    hideTyping();
    errBanner.style.display = "block";
    errBanner.textContent = "упс, не получилось связаться с Кити 😿 (" + e.message + "). Проверь интернет и попробуй снова.";
  }
}

form.addEventListener("submit", e => { e.preventDefault(); send(); });
document.getElementById("clearBtn").addEventListener("click", () => {
  history = [];
  try { localStorage.removeItem("kiti_chat"); } catch(e) {}
  chat.innerHTML = "";
  greet();
});
</script>
